<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in - Glassmorphism</title>
<style>
  :root { --glass: rgba(255,255,255,.14); --border: rgba(255,255,255,.3); --text: #fff; --muted: rgba(255,255,255,.75);
          --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: var(--font); color: var(--text); min-height: 100vh; display: grid; place-items: center; padding: 24px;
         background: linear-gradient(135deg, #7c3aed, #db2777 55%, #f59e0b); overflow: hidden; }
  /* floating colour blobs */
  .blob { position: fixed; border-radius: 50%; filter: blur(60px); opacity: .7; animation: float 12s ease-in-out infinite alternate; }
  .b1 { width: 340px; height: 340px; background: #22d3ee; top: -80px; left: -60px; }
  .b2 { width: 280px; height: 280px; background: #a3e635; bottom: -60px; right: -40px; animation-delay: -4s; }
  @keyframes float { to { transform: translate(40px, 30px) scale(1.1); } }

  .card { position: relative; width: min(400px, 100%); padding: 40px 34px; border-radius: 24px; background: var(--glass);
          border: 1px solid var(--border); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
          box-shadow: 0 30px 60px -20px rgba(0,0,0,.35); }
  h1 { font-size: 1.8rem; letter-spacing: -.02em; }
  .sub { color: var(--muted); margin: 6px 0 28px; }

  /* floating-label inputs */
  .field { position: relative; margin-bottom: 18px; }
  .field input { width: 100%; padding: 22px 46px 8px 16px; border-radius: 12px; border: 1px solid var(--border);
                 background: rgba(255,255,255,.1); color: var(--text); font: inherit; outline: none; transition: border-color .2s, background .2s; }
  .field input:focus { border-color: #fff; background: rgba(255,255,255,.18); }
  .field label { position: absolute; left: 16px; top: 15px; color: var(--muted); pointer-events: none; transition: all .18s; }
  .field input:focus + label, .field input:not(:placeholder-shown) + label { top: 6px; font-size: .75rem; }
  .eye { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: 0; color: var(--muted); cursor: pointer; padding: 6px; }

  .row { display: flex; justify-content: space-between; align-items: center; font-size: .88rem; margin: 4px 0 24px; }
  .row a { color: #fff; }
  .btn { width: 100%; padding: 14px; border: 0; border-radius: 12px; font: inherit; font-weight: 700; cursor: pointer;
         background: #fff; color: #7c3aed; transition: transform .15s, box-shadow .2s; }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 24px -10px rgba(0,0,0,.4); }
  .or { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: .85rem; margin: 22px 0; }
  .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .social { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .social button { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 11px; border-radius: 12px;
                   border: 1px solid var(--border); background: rgba(255,255,255,.08); color: #fff; font: inherit; cursor: pointer; }
  .social button:hover { background: rgba(255,255,255,.18); }
  .foot { text-align: center; margin-top: 24px; font-size: .9rem; color: var(--muted); }
  .foot a { color: #fff; font-weight: 600; }
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>
<form class="card" onsubmit="event.preventDefault(); this.querySelector('.btn').textContent = 'Signing in...';">
  <h1>Welcome back</h1>
  <p class="sub">Sign in to continue to your workspace.</p>
  <div class="field">
    <input id="email" type="email" placeholder=" " required autocomplete="email">
    <label for="email">Email address</label>
  </div>
  <div class="field">
    <input id="pw" type="password" placeholder=" " required autocomplete="current-password">
    <label for="pw">Password</label>
    <button type="button" class="eye" aria-label="Show password" onclick="togglePw(this)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </div>
  <div class="row"><label><input type="checkbox"> Remember me</label><a href="#">Forgot password?</a></div>
  <button class="btn" type="submit">Sign in</button>
  <div class="or">or continue with</div>
  <div class="social">
    <button type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-3.2 19.5c.5.1.7-.2.7-.5v-1.7c-2.8.6-3.4-1.3-3.4-1.3-.5-1.2-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.5 2.4 1.1 3 .8.1-.6.3-1.1.6-1.3-2.2-.3-4.6-1.1-4.6-5a3.9 3.9 0 0 1 1-2.7 3.6 3.6 0 0 1 .1-2.7s.8-.3 2.8 1a9.6 9.6 0 0 1 5 0c1.9-1.3 2.8-1 2.8-1 .5 1.4.2 2.4.1 2.7a3.9 3.9 0 0 1 1 2.7c0 3.9-2.4 4.7-4.6 5 .4.3.7.9.7 1.9V21c0 .3.2.6.7.5A10 10 0 0 0 12 2z"/></svg>GitHub</button>
    <button type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3z"/><path d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22z"/><path d="M6.4 14a6 6 0 0 1 0-3.9V7.4H3.1a10 10 0 0 0 0 9.2L6.4 14z"/><path d="M12 6c1.5 0 2.8.5 3.8 1.5l2.9-2.9A10 10 0 0 0 3.1 7.4L6.4 10C7.2 7.7 9.4 6 12 6z"/></svg>Google</button>
  </div>
  <p class="foot">New here? <a href="#">Create an account</a></p>
</form>
<script>
  function togglePw(btn) {
    const input = document.getElementById('pw');
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  }
</script>
</body>
</html>
