<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skeleton loading cards - Neon Cyberpunk</title>
<style>
/* Skeleton loading cards | style: Neon Cyberpunk | CSS component: skeleton loading cards
   Layout rule: all CSS here at the top, the HTML below. */
:root {
  --bg: #0a0014; --surface: #14002a; --text: #f5f3ff; --muted: #c4b5fd;
  --primary: #ff2bd6; --on-primary: #0a0014; --accent: #00f0ff; --border: rgba(0,240,255,.45);
  --radius: 4px; --shadow: 0 0 18px rgba(255,43,214,.45), inset 0 0 12px rgba(0,240,255,.15);
  --font: ui-monospace, 'Cascadia Code', Consolas, monospace; --head: inherit;
}
* { box-sizing: border-box; margin: 0; }
body { font-family: var(--font); background: #0a0014; color: var(--text); line-height: 1.6; min-height: 100vh;
       display: grid; place-items: center; padding: 40px 20px; }
h1, h2, h3 { font-family: var(--head); line-height: 1.2; }
.surface { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow);  }

.card { width: min(360px, 100%); padding: 22px; }
.sk { border-radius: calc(var(--radius) * .5); background: linear-gradient(90deg, var(--border) 25%, color-mix(in srgb, var(--border) 40%, var(--surface)) 50%, var(--border) 75%);
      background-size: 200% 100%; animation: shimmer 1.4s linear infinite; }
.avatar { width: 52px; height: 52px; border-radius: 50%; }
.line { height: 12px; margin-top: 12px; }
.w60 { width: 60%; } .w90 { width: 90%; } .w40 { width: 40%; }
.media { height: 150px; margin-top: 16px; }
@keyframes shimmer { to { background-position: -200% 0; } }
</style>
</head>
<body>
<div class="card surface" aria-busy="true">
  <div style="display:flex;gap:14px;align-items:center"><div class="sk avatar"></div><div style="flex:1"><div class="sk line w60"></div><div class="sk line w40"></div></div></div>
  <div class="sk media"></div><div class="sk line w90"></div><div class="sk line w60"></div>
</div>
</body>
</html>
