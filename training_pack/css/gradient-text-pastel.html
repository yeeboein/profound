<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gradient headline - Soft Pastel</title>
<style>
/* Gradient headline | style: Soft Pastel | CSS component: gradient headline
   Layout rule: all CSS here at the top, the HTML below. */
:root {
  --bg: #fdf6f0; --surface: #ffffff; --text: #3d3a4b; --muted: #7a7590;
  --primary: #f48fb1; --on-primary: #3d3a4b; --accent: #9be3d0; --border: #f1e4ef;
  --radius: 24px; --shadow: 0 14px 30px -18px rgba(61,58,75,.35);
  --font: 'Segoe UI Rounded', Nunito, system-ui, sans-serif; --head: inherit;
}
* { box-sizing: border-box; margin: 0; }
body { font-family: var(--font); background: #fdf6f0; color: var(--text); line-height: 1.6; min-height: 100vh;
       display: grid; place-items: center; padding: 40px 20px; }
h1, h2, h3 { font-family: var(--head); line-height: 1.2; }
.surface { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow);  }

.title { text-align: center; }
.title h1 { font-size: clamp(2.6rem, 8vw, 5.5rem); letter-spacing: -.04em; font-weight: 900;
            background: linear-gradient(120deg, var(--primary), var(--accent), var(--primary)); background-size: 200% auto;
            -webkit-background-clip: text; background-clip: text; color: transparent; animation: shine 6s linear infinite; }
.title p { color: var(--muted); font-size: 1.1rem; margin-top: 12px; }
@keyframes shine { to { background-position: 200% center; } }
</style>
</head>
<body>
<header class="title"><h1>Make it pop.</h1><p>An animated gradient headline in pure CSS.</p></header>
</body>
</html>
