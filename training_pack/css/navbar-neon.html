<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Navbar - Neon Cyberpunk</title>
<style>
/* Navbar | style: Neon Cyberpunk | CSS component: navbar
   Layout rule: all CSS here at the top, the HTML below. */
:root {
  --bg: #0a0014; --surface: #14002a; --text: #f5f3ff; --muted: #c4b5fd;
  --primary: #ff2bd6; --on-primary: #0a0014; --accent: #00f0ff; --border: rgba(0,240,255,.45);
  --radius: 4px; --shadow: 0 0 18px rgba(255,43,214,.45), inset 0 0 12px rgba(0,240,255,.15);
  --font: ui-monospace, 'Cascadia Code', Consolas, monospace; --head: inherit;
}
* { box-sizing: border-box; margin: 0; }
body { font-family: var(--font); background: #0a0014; color: var(--text); line-height: 1.6; min-height: 100vh;
       display: grid; place-items: center; padding: 40px 20px; }
h1, h2, h3 { font-family: var(--head); line-height: 1.2; }
.surface { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow);  }

.nav { width: min(1000px, 100%); display: flex; align-items: center; justify-content: space-between; padding: 14px 22px; }
.brand { font-weight: 800; font-size: 1.15rem; display: flex; align-items: center; gap: 10px; }
.brand i { width: 26px; height: 26px; border-radius: calc(var(--radius) * .6); background: var(--primary); display: inline-block; }
.links { display: flex; gap: 24px; list-style: none; padding: 0; }
.links a { color: var(--muted); text-decoration: none; font-weight: 500; transition: color .2s; }
.links a:hover, .links a.active { color: var(--text); }
.signup { padding: 9px 18px; border-radius: var(--radius); background: var(--primary); color: var(--on-primary); text-decoration: none; font-weight: 600; }
@media (max-width: 700px) { .links { display: none; } }
</style>
</head>
<body>
<nav class="nav surface">
  <a class="brand"><i></i>Brand</a>
  <ul class="links"><li><a class="active" href="#">Home</a></li><li><a href="#">Features</a></li><li><a href="#">Pricing</a></li><li><a href="#">About</a></li></ul>
  <a class="signup" href="#">Sign up</a>
</nav>
</body>
</html>
