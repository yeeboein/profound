<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avatar group - Glassmorphism</title>
<style>
/* Avatar group | style: Glassmorphism | CSS component: avatar group
   Layout rule: all CSS here at the top, the HTML below. */
:root {
  --bg: #7c3aed; --surface: rgba(255,255,255,.14); --text: #ffffff; --muted: rgba(255,255,255,.75);
  --primary: #ffffff; --on-primary: #7c3aed; --accent: #fde68a; --border: rgba(255,255,255,.3);
  --radius: 20px; --shadow: 0 24px 48px -20px rgba(0,0,0,.35);
  --font: system-ui, -apple-system, 'Segoe UI', sans-serif; --head: inherit;
}
* { box-sizing: border-box; margin: 0; }
body { font-family: var(--font); background: linear-gradient(135deg,#7c3aed,#db2777 55%,#f59e0b); color: var(--text); line-height: 1.6; min-height: 100vh;
       display: grid; place-items: center; padding: 40px 20px; }
h1, h2, h3 { font-family: var(--head); line-height: 1.2; }
.surface { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }

.team { padding: 26px 30px; display: flex; align-items: center; gap: 18px; }
.stack { display: flex; }
.av { width: 46px; height: 46px; border-radius: 50%; border: 3px solid var(--surface); margin-left: -12px; display: grid; place-items: center;
      color: #fff; font-weight: 800; font-size: .9rem; transition: transform .2s; }
.av:first-child { margin-left: 0; }
.av:hover { transform: translateY(-4px); z-index: 1; }
.more { background: var(--border); color: var(--text); }
.team p { color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
<div class="team surface">
  <div class="stack">
    <span class="av" style="background:#f97316">AJ</span><span class="av" style="background:#8b5cf6">LC</span>
    <span class="av" style="background:#06b6d4">MG</span><span class="av" style="background:#22c55e">NP</span><span class="av more">+8</span>
  </div>
  <p><b>12 people</b> are working on this</p>
</div>
</body>
</html>
