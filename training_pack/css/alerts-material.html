<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alerts - Material</title>
<style>
/* Alerts | style: Material | CSS component: alerts
   Layout rule: all CSS here at the top, the HTML below. */
:root {
  --bg: #fffbfe; --surface: #ffffff; --text: #1c1b1f; --muted: #625b71;
  --primary: #6750a4; --on-primary: #ffffff; --accent: #e8def8; --border: #e7e0ec;
  --radius: 16px; --shadow: 0 1px 3px rgba(0,0,0,.12), 0 4px 12px rgba(0,0,0,.08);
  --font: Roboto, system-ui, sans-serif; --head: inherit;
}
* { box-sizing: border-box; margin: 0; }
body { font-family: var(--font); background: #fffbfe; color: var(--text); line-height: 1.6; min-height: 100vh;
       display: grid; place-items: center; padding: 40px 20px; }
h1, h2, h3 { font-family: var(--head); line-height: 1.2; }
.surface { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow);  }

.stack { width: min(560px, 100%); display: grid; gap: 12px; }
.alert { display: flex; gap: 14px; padding: 16px 18px; border-radius: var(--radius); border: 1px solid color-mix(in srgb, var(--c) 35%, transparent);
         background: color-mix(in srgb, var(--c) 10%, var(--surface)); }
.alert b { color: var(--c); display: block; }
.alert p { color: var(--muted); font-size: .92rem; }
.dot { flex: none; width: 10px; height: 10px; margin-top: 7px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 25%, transparent); }
</style>
</head>
<body>
<div class="stack">
  <div class="alert" style="--c:#16a34a"><span class="dot"></span><div><b>Saved</b><p>Your changes are live.</p></div></div>
  <div class="alert" style="--c:#d97706"><span class="dot"></span><div><b>Heads up</b><p>Your trial ends in 3 days.</p></div></div>
  <div class="alert" style="--c:#dc2626"><span class="dot"></span><div><b>Error</b><p>We couldn't reach the server.</p></div></div>
</div>
</body>
</html>
