<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 page - Neo-Brutalism</title>
<style>
/* 404 page | style: Neo-Brutalism | CSS component: 404 page
   Layout rule: all CSS here at the top, the HTML below. */
:root {
  --bg: #fffdf5; --surface: #ffffff; --text: #000000; --muted: #333333;
  --primary: #ffde59; --on-primary: #000000; --accent: #5ce1e6; --border: #000000;
  --radius: 0px; --shadow: 6px 6px 0 #000;
  --font: 'Arial Black', 'Segoe UI Black', system-ui, sans-serif; --head: inherit;
}
* { box-sizing: border-box; margin: 0; }
body { font-family: var(--font); background: #fffdf5; color: var(--text); line-height: 1.6; min-height: 100vh;
       display: grid; place-items: center; padding: 40px 20px; }
h1, h2, h3 { font-family: var(--head); line-height: 1.2; }
.surface { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); border-width: 3px !important; }

.nf { text-align: center; }
.nf h1 { font-size: clamp(5rem, 20vw, 10rem); line-height: 1; font-weight: 900; color: var(--primary); text-shadow: var(--shadow); }
.nf h2 { margin: 10px 0 8px; }
.nf p { color: var(--muted); margin-bottom: 26px; }
.nf a { padding: 12px 24px; border-radius: var(--radius); background: var(--primary); color: var(--on-primary); text-decoration: none; font-weight: 700; display: inline-block; transition: transform .15s; }
.nf a:hover { transform: translateY(-2px); }
</style>
</head>
<body>
<main class="nf"><h1>404</h1><h2>Page not found</h2><p>The page you're looking for wandered off.</p><a href="/">Take me home</a></main>
</body>
</html>
