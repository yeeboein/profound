<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stat cards - Neon Cyberpunk</title>
<style>
/* Stat cards | style: Neon Cyberpunk | CSS component: stat cards
   Layout rule: all CSS here at the top, the HTML below. */
:root {
  --bg: #0a0014; --surface: #14002a; --text: #f5f3ff; --muted: #c4b5fd;
  --primary: #ff2bd6; --on-primary: #0a0014; --accent: #00f0ff; --border: rgba(0,240,255,.45);
  --radius: 4px; --shadow: 0 0 18px rgba(255,43,214,.45), inset 0 0 12px rgba(0,240,255,.15);
  --font: ui-monospace, 'Cascadia Code', Consolas, monospace; --head: inherit;
}
* { box-sizing: border-box; margin: 0; }
body { font-family: var(--font); background: #0a0014; color: var(--text); line-height: 1.6; min-height: 100vh;
       display: grid; place-items: center; padding: 40px 20px; }
h1, h2, h3 { font-family: var(--head); line-height: 1.2; }
.surface { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow);  }

.stats { width: min(900px, 100%); display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px; }
.stat { padding: 22px; }
.stat small { color: var(--muted); font-weight: 600; }
.stat strong { display: block; font-size: 2rem; margin: 6px 0; letter-spacing: -.02em; }
.up { color: #16a34a; font-weight: 700; font-size: .85rem; }
.down { color: #dc2626; font-weight: 700; font-size: .85rem; }
.spark { height: 34px; margin-top: 10px; background: linear-gradient(180deg, color-mix(in srgb, var(--primary) 30%, transparent), transparent);
         clip-path: polygon(0 80%, 15% 60%, 30% 70%, 45% 40%, 60% 50%, 75% 25%, 90% 35%, 100% 10%, 100% 100%, 0 100%); }
</style>
</head>
<body>
<section class="stats">
  <div class="stat surface"><small>Revenue</small><strong>$48.2k</strong><span class="up">&uarr; 12.4%</span><div class="spark"></div></div>
  <div class="stat surface"><small>Users</small><strong>9,731</strong><span class="up">&uarr; 4.9%</span><div class="spark"></div></div>
  <div class="stat surface"><small>Churn</small><strong>1.8%</strong><span class="down">&darr; 0.3%</span><div class="spark"></div></div>
</section>
</body>
</html>
