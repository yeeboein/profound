<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aero Runner - Product</title>
<style>
  :root { --bg: #f6f7f9; --card: #fff; --ink: #111418; --muted: #6b7280; --line: #e5e7eb; --accent: #ff5a36; --radius: 18px;
          --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: var(--font); background: var(--bg); color: var(--ink); }
  .wrap { width: min(1120px, 92vw); margin: 0 auto; padding: 40px 0 80px; }
  .crumbs { color: var(--muted); font-size: .9rem; margin-bottom: 22px; }
  .product { display: grid; grid-template-columns: 1.1fr 1fr; gap: 48px; }

  /* gallery */
  .main-img { aspect-ratio: 1; border-radius: var(--radius); display: grid; place-items: center; font-size: 9rem;
              background: radial-gradient(circle at 50% 60%, #fff 0, transparent 60%), var(--shade, #ffe1d9); transition: background .3s; }
  .thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 12px; }
  .thumbs button { aspect-ratio: 1; border-radius: 12px; border: 2px solid transparent; font-size: 2rem; cursor: pointer; background: #fff; }
  .thumbs button.on { border-color: var(--ink); }

  .info .brand { color: var(--accent); font-weight: 700; font-size: .85rem; letter-spacing: .1em; text-transform: uppercase; }
  h1 { font-size: 2.3rem; letter-spacing: -.02em; margin: 6px 0 8px; }
  .rating { color: #f59e0b; font-size: .95rem; } .rating span { color: var(--muted); margin-left: 6px; }
  .price { font-size: 1.9rem; font-weight: 800; margin: 18px 0; }
  .price s { color: var(--muted); font-size: 1.1rem; font-weight: 500; margin-left: 10px; }
  .price em { font-style: normal; font-size: .85rem; background: #ffe9e3; color: var(--accent); padding: 3px 9px; border-radius: 999px; margin-left: 8px; vertical-align: middle; }
  .label { font-weight: 600; margin: 22px 0 10px; font-size: .95rem; }
  .colors { display: flex; gap: 10px; }
  .colors button { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 1px var(--line); cursor: pointer; }
  .colors button.on { box-shadow: 0 0 0 2px var(--ink); }
  .sizes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .sizes button { padding: 12px 0; border-radius: 10px; border: 1px solid var(--line); background: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  .sizes button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .sizes button:disabled { color: #c4c7cc; text-decoration: line-through; cursor: not-allowed; }
  .buy { display: flex; gap: 12px; margin-top: 26px; }
  .qty { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
  .qty button { width: 42px; height: 50px; border: 0; background: none; font-size: 1.2rem; cursor: pointer; }
  .qty span { width: 28px; text-align: center; font-weight: 700; }
  .add { flex: 1; border: 0; border-radius: 12px; background: var(--ink); color: #fff; font: inherit; font-weight: 700; cursor: pointer; transition: transform .15s, background .2s; }
  .add:hover { background: var(--accent); } .add:active { transform: scale(.98); }
  .perks { display: grid; gap: 10px; margin-top: 26px; padding: 18px; background: #fff; border-radius: 14px; font-size: .92rem; color: var(--muted); }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 120px); background: var(--ink); color: #fff;
           padding: 14px 22px; border-radius: 12px; font-weight: 600; transition: transform .35s cubic-bezier(.2,.9,.3,1.3); }
  .toast.show { transform: translate(-50%, 0); }
  @media (max-width: 820px) { .product { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main class="wrap">
  <div class="crumbs">Home / Running / Shoes</div>
  <section class="product">
    <div>
      <div class="main-img" id="main">&#128095;</div>
      <div class="thumbs" id="thumbs">
        <button class="on" data-shade="#ffe1d9">&#128095;</button><button data-shade="#dbeafe">&#128094;</button>
        <button data-shade="#dcfce7">&#129406;</button><button data-shade="#f3e8ff">&#128098;</button>
      </div>
    </div>
    <div class="info">
      <div class="brand">Aero</div>
      <h1>Aero Runner 3</h1>
      <div class="rating">&#9733;&#9733;&#9733;&#9733;&#9733;<span>4.9 &middot; 2,148 reviews</span></div>
      <div class="price">$129<s>$159</s><em>Save 19%</em></div>
      <p style="color:var(--muted)">Featherlight knit upper, responsive foam and a grippy outsole made for city miles and weekend trails.</p>

      <div class="label">Colour: <span id="colorName">Sunset</span></div>
      <div class="colors" id="colors">
        <button class="on" style="background:#ff5a36" data-name="Sunset" data-shade="#ffe1d9" aria-label="Sunset"></button>
        <button style="background:#2563eb" data-name="Ocean" data-shade="#dbeafe" aria-label="Ocean"></button>
        <button style="background:#16a34a" data-name="Forest" data-shade="#dcfce7" aria-label="Forest"></button>
        <button style="background:#111418" data-name="Midnight" data-shade="#e5e7eb" aria-label="Midnight"></button>
      </div>

      <div class="label">Size (EU)</div>
      <div class="sizes" id="sizes">
        <button>39</button><button>40</button><button class="on">41</button><button>42</button><button disabled>43</button>
      </div>

      <div class="buy">
        <div class="qty"><button id="minus" aria-label="Less">&minus;</button><span id="q">1</span><button id="plus" aria-label="More">+</button></div>
        <button class="add" id="add">Add to cart</button>
      </div>
      <div class="perks"><span>&#128666; Free delivery over $50</span><span>&#8617;&#65039; 60-day free returns</span><span>&#128274; Secure checkout</span></div>
    </div>
  </section>
</main>
<div class="toast" id="toast">Added to cart &#10003;</div>
<script>
  const $ = id => document.getElementById(id), main = $('main');
  // pick one button in a group
  function single(group, onPick) {
    group.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
      if (b.disabled) return;
      group.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
      onPick && onPick(b);
    }));
  }
  single($('thumbs'), b => { main.textContent = b.textContent; main.style.setProperty('--shade', b.dataset.shade); });
  single($('colors'), b => { $('colorName').textContent = b.dataset.name; main.style.setProperty('--shade', b.dataset.shade); });
  single($('sizes'));
  let q = 1;
  $('minus').onclick = () => { q = Math.max(1, q - 1); $('q').textContent = q; };
  $('plus').onclick = () => { q = Math.min(9, q + 1); $('q').textContent = q; };
  $('add').onclick = () => {
    const t = $('toast'); t.textContent = `Added ${q} to cart ✓`; t.classList.add('show');
    clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200);
  };
</script>
</body>
</html>
