<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 - Lost in the grid</title>
<style>
  :root { --bg: #0a0014; --pink: #ff2bd6; --cyan: #00f0ff; --yellow: #f5f500; --font: "Consolas", "SF Mono", ui-monospace, monospace; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: #fff; font-family: var(--font); min-height: 100vh; display: grid; place-items: center; overflow: hidden; text-align: center; }
  /* perspective grid floor */
  .grid { position: fixed; inset: 50% -50% -50%; background-image: linear-gradient(var(--pink) 1px, transparent 1px), linear-gradient(90deg, var(--pink) 1px, transparent 1px);
          background-size: 60px 60px; transform: perspective(400px) rotateX(70deg); opacity: .35; animation: move 2.5s linear infinite;
          mask-image: linear-gradient(to top, #000 20%, transparent 90%); -webkit-mask-image: linear-gradient(to top, #000 20%, transparent 90%); }
  @keyframes move { to { background-position: 0 60px; } }
  .sun { position: fixed; top: 18%; left: 50%; width: 280px; height: 280px; margin-left: -140px; border-radius: 50%;
         background: linear-gradient(var(--yellow), var(--pink)); filter: blur(1px); opacity: .25;
         mask-image: repeating-linear-gradient(to bottom, #000 0 18px, transparent 18px 24px); -webkit-mask-image: repeating-linear-gradient(to bottom, #000 0 18px, transparent 18px 24px); }
  /* scanlines */
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none;
                background: repeating-linear-gradient(transparent 0 2px, rgba(0,0,0,.25) 2px 4px); }

  main { position: relative; z-index: 1; padding: 20px; }
  .code { position: relative; font-size: clamp(6rem, 25vw, 13rem); font-weight: 900; line-height: 1; color: #fff;
          text-shadow: 0 0 10px var(--cyan), 0 0 40px var(--cyan), 0 0 80px var(--pink); }
  /* glitch layers */
  .code::before, .code::after { content: attr(data-text); position: absolute; inset: 0; }
  .code::before { color: var(--pink); animation: glitch 2.2s infinite steps(1); clip-path: inset(0 0 60% 0); }
  .code::after { color: var(--cyan); animation: glitch 1.7s infinite reverse steps(1); clip-path: inset(55% 0 0 0); }
  @keyframes glitch { 0%, 88%, 100% { transform: none; } 90% { transform: translate(-6px, 2px); } 94% { transform: translate(6px, -2px); } }
  h1 { font-size: clamp(1.1rem, 3vw, 1.6rem); letter-spacing: .3em; text-transform: uppercase; color: var(--yellow);
       text-shadow: 0 0 12px rgba(245,245,0,.6); margin: 10px 0 14px; }
  p { color: #c9b8ff; max-width: 42ch; margin: 0 auto 32px; line-height: 1.6; }
  .btn { display: inline-block; padding: 14px 28px; border: 2px solid var(--cyan); color: var(--cyan); text-decoration: none; letter-spacing: .15em;
         text-transform: uppercase; box-shadow: 0 0 18px rgba(0,240,255,.4), inset 0 0 18px rgba(0,240,255,.2); transition: all .2s; }
  .btn:hover { background: var(--cyan); color: var(--bg); box-shadow: 0 0 40px var(--cyan); }
  .blink { animation: blink 1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
</style>
</head>
<body>
<div class="sun"></div><div class="grid"></div>
<main>
  <div class="code" data-text="404">404</div>
  <h1>Signal lost</h1>
  <p>The page you're looking for drifted off the grid. Maybe it never existed, maybe it's still loading in another dimension.<span class="blink">_</span></p>
  <a class="btn" href="/">&larr; Back to base</a>
</main>
</body>
</html>
